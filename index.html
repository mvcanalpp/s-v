<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Benim En Kıymetlim ❤️</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
    #app{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #slide{width:100vw;height:100vh;height:100dvh;object-fit:contain;background:#000;transition:opacity .18s ease,transform .22s ease}
    #slide.fade{opacity:.08;transform:scale(1.015)}
    .dots{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:5px;z-index:5}
    .dot{height:3px;flex:1;border-radius:99px;background:rgba(255,255,255,.25)}
    .dot.on{background:linear-gradient(90deg,#ff4fba,#ffd166,#75c9ff);box-shadow:0 0 12px rgba(255,255,255,.55)}
    .hint{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;color:rgba(255,255,255,.78);background:rgba(0,0,0,.45);padding:8px 13px;border-radius:999px;font:12px Arial,sans-serif;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .tap{position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 28px rgba(255,255,255,.65);transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:9}
    .tap.show{animation:tap .42s ease-out}
    @keyframes tap{0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
  </style>
</head>
<body>
  <main id="app">
    <div class="dots" id="dots"></div>
    <img id="slide" src="slides/slide-1.jpg" alt="Romantik sürpriz">
    <div class="tap" id="tap"></div>
    <div class="hint" id="hint">Devam etmek için dokun ✨</div>
  </main>

  <script>
    const slides = [
      "slides/slide-1.jpg",
      "slides/slide-2.jpg",
      "slides/slide-3.jpg",
      "slides/slide-4.jpg",
      "slides/slide-5.jpg",
      "slides/slide-6.jpg"
    ];

    let index = 0;
    let locked = false;

    const app = document.getElementById("app");
    const slide = document.getElementById("slide");
    const tap = document.getElementById("tap");
    const hint = document.getElementById("hint");
    const dots = document.getElementById("dots");

    slides.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = i === 0 ? "dot on" : "dot";
      dots.appendChild(d);
      const img = new Image();
      img.src = slides[i];
    });

    function updateDots() {
      [...dots.children].forEach((d, i) => d.className = i === index ? "dot on" : "dot");
    }

    function showSlide() {
      slide.classList.add("fade");
      setTimeout(() => {
        slide.src = slides[index];
        updateDots();
        hint.textContent = index === slides.length - 1 ? "Başa dönmek için dokun ❤️" : "Devam etmek için dokun ✨";
        slide.classList.remove("fade");
      }, 100);
    }

    function tapEffect(x, y) {
      tap.style.left = x + "px";
      tap.style.top = y + "px";
      tap.classList.remove("show");
      void tap.offsetWidth;
      tap.classList.add("show");
    }

    function next(x, y) {
      if (locked) return;
      locked = true;
      tapEffect(x, y);
      index = index < slides.length - 1 ? index + 1 : 0;
      showSlide();
      setTimeout(() => locked = false, 260);
    }

    app.addEventListener("pointerup", e => next(e.clientX, e.clientY));
    app.addEventListener("touchend", e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      next(t.clientX, t.clientY);
    }, {passive:false});
  </script>
</body>
</html>
